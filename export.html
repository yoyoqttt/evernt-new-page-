<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Export Responses</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;background:#19365f;color:#19365f}
  .box{width:min(420px,calc(100% - 32px));background:#f8fafc;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#647897;font-size:14px;margin:0 0 20px}
  input{width:100%;height:50px;border:1px solid #cbd7e8;border-radius:12px;padding:0 16px;font-size:15px;margin-bottom:12px;outline:none}
  input:focus{border-color:#ef6b24}
  button{width:100%;height:50px;border:0;border-radius:999px;background:#ef6b24;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{color:#c43c2f;font-size:13px;min-height:18px;margin-bottom:8px}
  .count{font-size:34px;font-weight:800;margin:4px 0 2px}
  #panel{display:none}
</style>
</head>
<body>
<div class="box">
  <div id="login">
    <h1>Admin Login</h1>
    <p>Enter the password to download responses.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="off" />
    <div class="err" id="err"></div>
    <button id="loginBtn" type="button">Login</button>
  </div>

  <div id="panel">
    <h1>Responses</h1>
    <div class="count" id="count">0</div>
    <p>received so far (updates live)</p>
    <button id="dlBtn" type="button" disabled>Download Excel</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="export.js"></script>
</body>
</html>
